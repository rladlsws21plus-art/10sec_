<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Stop Time - 10초 맞추기 게임</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #machine-container {
            position: relative;
            width: 400px;
            height: 700px;
            background: url('image_0.png') no-repeat center center;
            background-size: contain;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        #timer-display {
            position: absolute;
            top: 235px;
            left: 125px;
            width: 150px;
            height: 50px;
            background-color: black;
            border: 2px solid #444;
            border-radius: 5px;
            font-family: 'Digital-7', monospace;
            font-size: 45px;
            color: #00FF00;
            text-align: right;
            padding-right: 10px;
            line-height: 50px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.5);
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.8);
            box-sizing: border-box;
        }

        #result-panel {
            position: absolute;
            top: 310px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 100px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 1px solid #FFD700;
            border-radius: 10px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #FFD700;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 5px #FFD700;
            padding: 10px;
            box-sizing: border-box;
        }
        #final-time {
            font-size: 35px;
            margin-bottom: 5px;
        }

        #control-panel {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.2s;
            touch-action: manipulation; /* 터치 클릭 지연(300ms) 제거 */
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
        }
        #start-btn {
            background-color: #007BFF;
            color: white;
            box-shadow: 0 5px #0056b3;
        }
        #stop-btn {
            background-color: #DC3545;
            color: white;
            box-shadow: 0 5px #a71d2a;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }
        
        #game-info {
            margin-top: 20px;
            font-size: 18px;
            color: #ccc;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

    <div id="machine-container">
        <div id="timer-display">0.00</div>
        
        <div id="result-panel">
            <div id="final-time">0.00초</div>
            <div id="result-message"></div>
        </div>

        <div id="control-panel">
            <button id="start-btn" onclick="startGame()">시작</button>
            <button id="stop-btn" onclick="stopGame()" disabled>정지</button>
        </div>
    </div>

    <div id="game-info">4성사이다 전용게임</div>

    <script>
        let fontLink = document.createElement('link');
        fontLink.href = 'https://fonts.cdnfonts.com/css/digital-7';
        fontLink.rel = 'stylesheet';
        document.head.appendChild(fontLink);

        let startTime;
        let timerInterval;
        let running = false;
        let currentSeconds = 0;

        const timerDisplay = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resultPanel = document.getElementById('result-panel');
        const finalTimeDisplay = document.getElementById('final-time');
        const resultMessageDisplay = document.getElementById('result-message');

        function startGame() {
            if (running) return;
            running = true;
            resultPanel.style.display = 'none';
            startBtn.disabled = true;
            stopBtn.disabled = false;
            startTime = performance.now(); 
            
            timerInterval = requestAnimationFrame(updateTimer);
        }

        function updateTimer() {
            if (!running) return;
            
            let now = performance.now();
            currentSeconds = (now - startTime) / 1000;
            
            timerDisplay.innerText = currentSeconds.toFixed(2);
            
            timerInterval = requestAnimationFrame(updateTimer);
        }

        function stopGame() {
    if (!running) return;

                 // 스탑 버튼 터치 지연 방지 (손이 닿자마자 실행)
stopBtn.addEventListener('touchstart', function(e) {
    e.preventDefault(); // 기본 클릭 지연 이벤트 방지
    stopGame();
}, { passive: false });
            
    // 1. 버튼 누른 '즉시' 시간을 먼저 캡처합니다.
    let now = performance.now();
    cancelAnimationFrame(timerInterval);
    running = false;

    // 2. 정확한 최종 시간을 계산합니다.
    currentSeconds = (now - startTime) / 1000;
    
    startBtn.disabled = false;
    stopBtn.disabled = true;
    
    // 화면 타이머도 멈춘 순간의 값으로 즉시 업데이트
    let finalTime = currentSeconds.toFixed(2);
    timerDisplay.innerText = finalTime;
    
    let resultText = "";
    
    // 정확히 10.00초일 때만 성공 처리
    if (finalTime === "10.00") {
        resultText = "🎉 PERFECT! 맞췄으니까 한잔해! 🎉";
    } else {
        resultText = "❌ 언제 맞출거늬~ !";
    }
    
    finalTimeDisplay.innerText = finalTime + "초";
    resultMessageDisplay.innerText = resultText;
    resultPanel.style.display = 'flex';
}

    </script>

</body>
</html>
